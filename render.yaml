services:
  - type: web
    name: face-project-web
    env: python
    plan: free
    region: singapore
    # git-lfs is neither preinstalled on Render's native Python image nor
    # installable via apt-get there (the system filesystem is read-only —
    # apt-get fails outright). Fetch the static binary release straight from
    # GitHub into the build's own (writable) working directory instead. No
    # `|| true` on the pull: a broken model pull should fail the deploy
    # loudly, not silently ship corrupt (pointer-file) models.
    buildCommand: >-
      curl -sL https://github.com/git-lfs/git-lfs/releases/download/v3.5.1/git-lfs-linux-amd64-v3.5.1.tar.gz | tar xz &&
      ./git-lfs-3.5.1/git-lfs install --local --force &&
      ./git-lfs-3.5.1/git-lfs pull &&
      pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements-web.txt
    startCommand: "uvicorn backend.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_TOKEN
        generateValue: true
