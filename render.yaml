services:
  - type: web
    name: face-project-web
    env: python
    plan: free
    region: singapore
    # Render's native Python build environment has a read-only system
    # filesystem — `apt-get install` fails outright there, so git-lfs has to
    # already be on the image (Render documents native LFS support). No
    # `|| true` on the pull: a broken model pull should fail the deploy
    # loudly, not silently ship corrupt (pointer-file) models.
    buildCommand: "git lfs pull && pip install -r requirements-web.txt"
    startCommand: "uvicorn backend.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_TOKEN
        generateValue: true
