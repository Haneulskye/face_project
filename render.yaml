services:
  - type: web
    name: face-project-web
    env: python
    plan: free
    region: singapore
    buildCommand: "git lfs pull || true; pip install -r requirements-web.txt"
    startCommand: "uvicorn backend.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
