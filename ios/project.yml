name: FaceAuth
options:
  bundleIdPrefix: com.faceproject
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  FaceAuth:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FaceAuth
        excludes:
          - Info.plist
    resources:
      - path: FaceAuth/Resources/Assets.xcassets
    info:
      path: FaceAuth/Info.plist
      properties:
        CFBundleDisplayName: 얼굴·심박 인증
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 얼굴 인식을 위해 카메라 접근 권한이 필요합니다.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faceproject.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
