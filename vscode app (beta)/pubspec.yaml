name: face_pj
description: 얼굴 인식 기반 심박수 관리 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 카메라 + 얼굴 검출
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0

  # 얼굴 임베딩(동일인 판별)용 TFLite
  tflite_flutter: ^0.11.0
  image: ^4.2.0

  # 스마트워치 / 외부 센서 (BLE Heart Rate Service 0x180D)
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1

  # 로컬 DB
  sqflite: ^2.3.3
  path: ^1.9.0

  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/mobilefacenet.tflite
